name: simple_cashier_monorepo
description: Monorepo workspace for SimpleCashierApp - General Goods & Services POS
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

workspace:
  - apps/app_local_simple_cashier
  - packages/core
  - packages/database
  - packages/ui
  - packages/thermal_printer

dev_dependencies:
  melos: ^8.2.2

melos:
  scripts:
    analyze:
      exec: flutter analyze .
      description: Run flutter analyze across all packages and apps.

    test:
      exec: flutter test
      description: Run flutter test in all packages with test suite.
      packageFilters:
        dirExists: test

    codegen:
      exec: dart run build_runner build --delete-conflicting-outputs
      description: Run build_runner code generation across all packages with build_runner.
      packageFilters:
        dependsOn:
          - build_runner

    codegen:watch:
      exec: dart run build_runner watch --delete-conflicting-outputs
      description: Run build_runner watch mode.
      packageFilters:
        dependsOn:
          - build_runner

    clean:
      exec: flutter clean
      description: Clean build cache in all apps and packages.
